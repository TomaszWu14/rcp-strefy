name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Zależności
        run: pip install "flask==3.1.3" "pandas==3.0.6" "pyarrow==25.0.1" "openpyxl==3.1.5"
      - name: Testy uprawnień
        run: python -m unittest discover -s tests -v

  docker:
    # Obraz demo: build, start z DEMO_MODE=1, logowanie kontem demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t rcp-demo .
      - name: Smoke
        run: |
          docker run -d --name rcp -p 8000:8000 -e DEMO_MODE=1 -e FLASK_SECRET_KEY=ci rcp-demo
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/ >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/ | grep -q 'name="password"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'username=kierownik&password=demo123' http://127.0.0.1:8000/)
          test "$code" = 302 || { docker logs rcp; exit 1; }
