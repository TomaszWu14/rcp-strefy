name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Zależności
        run: pip install "flask==3.1.3" "pandas==3.0.6" "pyarrow==25.0.1" "openpyxl==3.1.5"
      - name: Testy uprawnień
        run: python -m unittest discover -s tests -v
