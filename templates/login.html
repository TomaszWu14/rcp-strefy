<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>TIMER – Logowanie</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">⏱</div>
  <h1 class="login-title">TIMER</h1>
  <p class="login-sub">System czasu pracy w strefach magazynowych</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat,msg in msgs %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST" class="login-form">
    <div class="form-group">
      <label>Login</label>
      <input type="text" name="username" placeholder="np. MKOWALSKI" required autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label>Hasło</label>
      <input type="password" name="password" placeholder="Hasło" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary btn-full">Zaloguj się →</button>
  </form>
  <p class="login-hint">Demo: login <code>admin</code>, hasło <code>demo123</code> (po <code>python tools/generate_demo_data.py</code>)</p>
</div>
</body>
</html>
